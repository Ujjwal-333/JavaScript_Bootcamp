<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate DSA Visualizer | Custom Input Edition</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --secondary: #64748b; 
            --accent: #f59e0b; 
            --bg: #f8fafc; 
            --surface: #ffffff; 
            --dark: #0f172a;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-bottom: 50px; 
        }

        .container { 
            width: 95%; 
            max-width: 1100px; 
            margin: 20px; 
            background: var(--surface); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }

        .header { text-align: center; margin-bottom: 20px; }
        
        .controls { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            background: #f1f5f9; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        
        /* Custom Input Styling */
        .custom-input-box {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid #cbd5e1;
            padding-top: 15px;
        }

        #customArrayInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
        }

        #visualizer { 
            height: 350px; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center; 
            gap: 4px; 
            padding: 10px; 
            background: var(--dark); 
            border-radius: 8px; 
        }

        .bar { 
            background: var(--primary); 
            width: 100%; 
            border-radius: 2px 2px 0 0; 
            transition: height 0.1s ease; 
            position: relative;
        }

        /* Value label on top of bar */
        .bar::after {
            content: attr(data-value);
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 10px;
            font-weight: bold;
        }

        .live-log { 
            margin-top: 15px; 
            padding: 12px; 
            background: var(--dark); 
            color: #38bdf8; 
            border-radius: 8px; 
            font-family: 'Courier New', monospace; 
            height: 45px; 
            border-left: 5px solid var(--primary); 
            display: flex; 
            align-items: center; 
            font-size: 0.9rem;
        }

        .analysis-section { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-top: 25px; 
            display: none; 
        }

        .card { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .history-log { height: 250px; overflow-y: auto; font-size: 0.85rem; background: #fafafa; padding: 10px; }
        
        button { padding: 12px; cursor: pointer; border: none; border-radius: 6px; font-weight: 600; transition: 0.2s; }
        .generate-btn { background: var(--secondary); color: white; }
        .start-btn { background: var(--primary); color: white; }
        .custom-btn { background: var(--accent); color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #dbeafe; color: #1e40af; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>DSA Algorithm Master Visualizer</h1>
        <p>Custom Input | Step-by-Step Logic | Efficiency Analyzer</p>
    </div>

    <div class="controls">
        <div class="input-group">
            <label>Algorithm:</label>
            <select id="algoSelect">
                <option value="bubble">Bubble Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="insertion">Insertion Sort</option>
                <option value="merge">Merge Sort</option>
                <option value="quick">Quick Sort</option>
            </select>
        </div>
        <div class="input-group">
            <label>Speed (ms):</label>
            <input type="range" id="speedInput" min="10" max="1500" value="300" dir="rtl">
        </div>
        <button class="generate-btn" onclick="generateRandom()">Random Array</button>
        <button class="start-btn" id="startBtn" onclick="runVisualizer()">Start Sorting</button>

        <div class="custom-input-box">
            <input type="text" id="customArrayInput" placeholder="Enter numbers separated by comma (e.g. 45, 10, 88, 23)">
            <button class="custom-btn" onclick="useCustomArray()">Use Custom Array</button>
        </div>
    </div>

    <div id="visualizer"></div>
    <div id="liveLog" class="live-log">Ready. Use 'Random' or 'Custom' to load an array.</div>

    <div id="analysisSection" class="analysis-section">
        <div class="card">
            <h3>Algorithm Analysis</h3>
            <div id="metricsContent"></div>
            <div id="advisorContent" style="margin-top:15px; font-weight:bold; color:#92400e;"></div>
        </div>
        <div class="card">
            <h3>Step History Log</h3>
            <div id="historyLog" class="history-log"></div>
        </div>
    </div>
</div>

<script>
    let array = [];
    let stepHistory = [];
    const visualizer = document.getElementById('visualizer');
    const liveLog = document.getElementById('liveLog');
    const historyLog = document.getElementById('historyLog');
    const speedInput = document.getElementById('speedInput');

    // 1. Array Generation Functions
    function generateRandom() {
        renderBars(Array.from({length: 15}, () => Math.floor(Math.random() * 250) + 10));
        track("Random array generated.");
    }

    function useCustomArray() {
        const input = document.getElementById('customArrayInput').value;
        if (!input) return alert("Please enter some numbers!");
        
        const customArray = input.split(',').map(num => parseInt(num.trim())).filter(num => !isNaN(num));
        if (customArray.length < 2) return alert("Please enter at least 2 numbers!");
        
        renderBars(customArray);
        track("Custom array loaded: " + customArray.join(', '));
    }

    function renderBars(newArray) {
        array = [...newArray];
        stepHistory = [];
        visualizer.innerHTML = '';
        document.getElementById('analysisSection').style.display = 'none';
        
        array.forEach(val => {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = `${val}px`;
            bar.setAttribute('data-value', val);
            visualizer.appendChild(bar);
        });
    }

    // 2. Utility Functions
    const sleep = (ms) => new Promise(res => setTimeout(res, ms));
    
    function track(msg) {
        liveLog.innerText = ">> " + msg;
        stepHistory.push(msg);
    }

    // 3. Sorting Algorithms
    async function runVisualizer() {
        const algo = document.getElementById('algoSelect').value;
        const bars = document.getElementsByClassName('bar');
        if (array.length === 0) return alert("Load an array first!");
        
        document.getElementById('startBtn').disabled = true;
        if (algo === 'bubble') await bubbleSort(bars);
        if (algo === 'selection') await selectionSort(bars);
        if (algo === 'insertion') await insertionSort(bars);
        if (algo === 'merge') await mergeSort(0, array.length - 1, bars);
        if (algo === 'quick') await quickSort(0, array.length - 1, bars);
        
        finalize(algo);
        document.getElementById('startBtn').disabled = false;
    }

    async function bubbleSort(bars) {
        for (let i = 0; i < array.length; i++) {
            for (let j = 0; j < array.length - i - 1; j++) {
                bars[j].style.background = 'red';
                bars[j+1].style.background = 'red';
                track(`Comparing ${array[j]} and ${array[j+1]}`);
                if (array[j] > array[j+1]) {
                    track(`Swap: ${array[j]} > ${array[j+1]}`);
                    await sleep(speedInput.value);
                    [array[j], array[j+1]] = [array[j+1], array[j]];
                    updateBar(j); updateBar(j+1);
                }
                bars[j].style.background = '#2563eb';
                bars[j+1].style.background = '#2563eb';
            }
            bars[array.length-i-1].style.background = '#22c55e';
        }
    }

    async function selectionSort(bars) {
        for (let i = 0; i < array.length; i++) {
            let minIdx = i;
            bars[i].style.background = 'orange';
            for (let j = i + 1; j < array.length; j++) {
                bars[j].style.background = 'red';
                await sleep(speedInput.value / 2);
                if (array[j] < array[minIdx]) {
                    if(minIdx !== i) bars[minIdx].style.background = '#2563eb';
                    minIdx = j;
                    bars[minIdx].style.background = 'orange';
                } else bars[j].style.background = '#2563eb';
            }
            [array[i], array[minIdx]] = [array[minIdx], array[i]];
            updateBar(i); updateBar(minIdx);
            bars[i].style.background = '#22c55e';
            track(`Placed minimum ${array[i]} at index ${i}`);
        }
    }

    async function insertionSort(bars) {
        for (let i = 1; i < array.length; i++) {
            let key = array[i];
            let j = i - 1;
            bars[i].style.background = 'orange';
            while (j >= 0 && array[j] > key) {
                await sleep(speedInput.value);
                array[j+1] = array[j];
                updateBar(j+1);
                bars[j+1].style.background = '#22c55e';
                j--;
            }
            array[j+1] = key;
            updateBar(j+1);
            for(let k=0; k<=i; k++) bars[k].style.background = '#22c55e';
        }
    }

    async function mergeSort(l, r, bars) {
        if (l >= r) return;
        let m = Math.floor((l + r) / 2);
        await mergeSort(l, m, bars);
        await mergeSort(m + 1, r, bars);
        await merge(l, m, r, bars);
    }

    async function merge(l, m, r, bars) {
        let n1 = m - l + 1, n2 = r - m;
        let L = array.slice(l, m + 1), R = array.slice(m + 1, r + 1);
        let i = 0, j = 0, k = l;
        while (i < n1 && j < n2) {
            await sleep(speedInput.value);
            if (L[i] <= R[j]) array[k] = L[i++];
            else array[k] = R[j++];
            updateBar(k);
            bars[k].style.background = '#22c55e';
            k++;
        }
        while (i < n1) { array[k] = L[i++]; updateBar(k); bars[k].style.background = '#22c55e'; k++; await sleep(speedInput.value); }
        while (j < n2) { array[k] = R[j++]; updateBar(k); bars[k].style.background = '#22c55e'; k++; await sleep(speedInput.value); }
    }

    async function quickSort(l, r, bars) {
        if (l < r) {
            let pivotIdx = await partition(l, r, bars);
            await quickSort(l, pivotIdx - 1, bars);
            await quickSort(pivotIdx + 1, r, bars);
        }
        if(l == 0 && r == array.length - 1) for(let b of bars) b.style.background = '#22c55e';
    }

    async function partition(l, r, bars) {
        let pivot = array[r];
        bars[r].style.background = 'orange';
        let i = l - 1;
        for (let j = l; j < r; j++) {
            bars[j].style.background = 'red';
            await sleep(speedInput.value);
            if (array[j] < pivot) {
                i++;
                [array[i], array[j]] = [array[j], array[i]];
                updateBar(i); updateBar(j);
            }
            bars[j].style.background = '#2563eb';
        }
        [array[i+1], array[r]] = [array[r], array[i+1]];
        updateBar(i+1); updateBar(r);
        return i + 1;
    }

    function updateBar(idx) {
        const bars = document.getElementsByClassName('bar');
        bars[idx].style.height = `${array[idx]}px`;
        bars[idx].setAttribute('data-value', array[idx]);
    }

    // 4. Final Analysis Display
    function finalize(algo) {
        const section = document.getElementById('analysisSection');
        const metrics = document.getElementById('metricsContent');
        const advisor = document.getElementById('advisorContent');
        
        section.style.display = 'grid';
        const data = {
            bubble: {t: "O(n²)", s: "O(1)"},
            selection: {t: "O(n²)", s: "O(1)"},
            insertion: {t: "O(n²)", s: "O(1)"},
            merge: {t: "O(n log n)", s: "O(n)"},
            quick: {t: "O(n log n)", s: "O(log n)"}
        };

        metrics.innerHTML = `<p><span class="badge">Time</span> <b>${data[algo].t}</b> | <span class="badge">Space</span> <b>${data[algo].s}</b></p>`;
        advisor.innerText = (array.length > 20 && data[algo].t.includes('n²')) ? "Advice: Large data ke liye ye slow hai. Merge/Quick use karein." : "Good choice for this dataset!";

        historyLog.innerHTML = stepHistory.map((s, idx) => `<p><b>${idx+1}.</b> ${s}</p>`).join('');
    }

    generateRandom(); // Initial Load
</script>
</body>
</html>
